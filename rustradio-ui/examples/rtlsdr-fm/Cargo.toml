[workspace]
[package]
name = "rtlsdr-fm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
async-channel = { version = "2.5.0", default-features = false }
console_error_panic_hook = "0.1.7"
log = "0.4.33"
rtlsdr-pure = "0.1.6"
rustradio = { version = "0.18.0", features = ["wasm", "fast-math", "simd"] }
#rustradio-ui = { path = "../..", features = ["audio"] }
rustradio-ui = { version = "0.1.20", features = ["audio"] }
serde = "1.0.228"
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = "0.3.102"

[lib]
crate-type = ["cdylib"]

[patch.crates-io]
rustradio = { path = "../../.." }
rustradio-ui = { path = "../.." }

[package.metadata.wasm-pack.profile.profiling]
# wasm-bindgen, called by wasm-pack, needs to be told to keep debug info in
# profiling profile.
wasm-opt = ["-O", "-g"]
