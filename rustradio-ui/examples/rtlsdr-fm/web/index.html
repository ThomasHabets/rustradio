<!DOCTYPE html>
<html id="root-html" lang="en" data-git-version="GIT_VERSION_NOT_SET">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RustRadio WASM AX.25 decoder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Visualizations -->
  <section id="waterfall">Loading…</section>
  <section id="audio-waveform">Loading…</section>
  <button id="button-start" disabled>Start</button>

  <!-- Controls -->
  <label for="input-frequency">Frequency (MHz)</label>
  <input id="input-frequency" disabled value="100.0" />
  <button id="button-tune" disabled>Tune</button>
  <label for="input-gain">Gain (dB or auto)</label>
  <input id="input-gain" disabled value="auto" />
  <button id="button-gain" disabled>Set gain</button>
  <label for="input-volume">Audio volume</label>
  <input id="input-volume" type="range" min="0" max="1" step="0.01" value="0.00">

  <!-- Log -->
  <pre id="log-output">Awaiting logs…</pre>
  <script type="module" src="wasm-mod.js"></script>
</body>
</html>
