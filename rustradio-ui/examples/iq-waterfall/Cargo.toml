[workspace]

[package]
name = "iq-waterfall"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
unstable = ["rustradio/unstable", "rustradio-ui/unstable"]

[dependencies]
async-channel = { version = "2.5.0", default-features = false }
console_error_panic_hook = "0.1.7"
log = "0.4.33"
rustradio = { path = "../../..", features = ["wasm"] }
rustradio-ui = { path = "../.." }
rustradio_macros = { path = "../../../rustradio_macros" }
serde = { version = "1.0.228", features = ["derive"] }
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = { version = "0.3.102", features = ["HtmlSelectElement", "Location", "Url", "Window"] }

# Keep transitive UI dependencies on the same local crates as the example.
[patch.crates-io]
rustradio = { path = "../../.." }
rustradio_macros = { path = "../../../rustradio_macros" }
rustradio_macros_code = { path = "../../../rustradio_macros_code" }
