name: Run tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lowdep:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    name: Low dependency build
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - name: Identify toolchains
      id: toolchains
      run: |
        rustc --version > "$RUNNER_TEMP/toolchains"
        if rustup toolchain list | grep -q '^nightly'; then
          rustc +nightly --version >> "$RUNNER_TEMP/toolchains"
        fi
        echo "key=$(sha256sum "$RUNNER_TEMP/toolchains" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/check-tools
          target
        key: ${{ runner.os }}-${{ github.job }}-${{ steps.toolchains.outputs.key }}-${{ hashFiles('Cargo.lock', '.github/workflows/runtests.yml', 'tickbox/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ github.job }}-${{ steps.toolchains.outputs.key }}-
    - name: Build
      run: cargo build --locked --no-default-features --verbose
    - name: Build examples
      run: cargo build --locked --no-default-features --verbose --examples
  standard:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    name: Standard tests
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - name: Install Rust nightly
      run: rustup toolchain install nightly --profile minimal
    - name: Rustup install nightly clippy
      run: rustup component add --toolchain nightly clippy
    - name: Rustup install wasm32
      run: rustup target add wasm32-unknown-unknown
    - name: Identify toolchains
      id: toolchains
      run: |
        rustc --version > "$RUNNER_TEMP/toolchains"
        if rustup toolchain list | grep -q '^nightly'; then
          rustc +nightly --version >> "$RUNNER_TEMP/toolchains"
        fi
        echo "key=$(sha256sum "$RUNNER_TEMP/toolchains" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/check-tools
          target
        key: ${{ runner.os }}-${{ github.job }}-${{ steps.toolchains.outputs.key }}-${{ hashFiles('Cargo.lock', '.github/workflows/runtests.yml', 'tickbox/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ github.job }}-${{ steps.toolchains.outputs.key }}-
    - name: cargo install
      run: |
        echo "$RUNNER_TEMP/check-tools/bin" >> "$GITHUB_PATH"
        cargo install --root "$RUNNER_TEMP/check-tools" --locked cargo-deny tickbox
    - name: apt-get update
      run:  sudo apt-get update
    - name: Install dependencies
      run:  sudo apt-get install -y librtlsdr-dev libsoapysdr-dev libjack-dev libasound-dev libfftw3-dev libpipewire-0.3-dev libvolk-dev libuhd-dev
    - name: Run tickbox
      run: NODIFF=true tickbox --dir tickbox/precommit --disable-tui --max-concurrency=1
  individual_features:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    name: Individual features
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - name: Install Rust nightly
      run: rustup toolchain install nightly --profile minimal
    - name: Identify toolchains
      id: toolchains
      run: |
        rustc --version > "$RUNNER_TEMP/toolchains"
        if rustup toolchain list | grep -q '^nightly'; then
          rustc +nightly --version >> "$RUNNER_TEMP/toolchains"
        fi
        echo "key=$(sha256sum "$RUNNER_TEMP/toolchains" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/check-tools
          target
        key: ${{ runner.os }}-${{ github.job }}-${{ steps.toolchains.outputs.key }}-${{ hashFiles('Cargo.lock', '.github/workflows/runtests.yml', 'tickbox/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ github.job }}-${{ steps.toolchains.outputs.key }}-
    - name: cargo install
      run: |
        echo "$RUNNER_TEMP/check-tools/bin" >> "$GITHUB_PATH"
        cargo install --root "$RUNNER_TEMP/check-tools" --locked tickbox
    - name: apt-get update
      run:  sudo apt-get update
    - name: Install dependencies
      run:  sudo apt-get install -y librtlsdr-dev libsoapysdr-dev libjack-dev libasound-dev libfftw3-dev libpipewire-0.3-dev libvolk-dev libuhd-dev
    - name: Run tickbox
      run: SLOW=true NODIFF=true tickbox --dir tickbox/precommit --disable-tui --max-concurrency=1 --matching '^(10|26)-.*'
  extended:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    name: Default, minimal, nightly, and benchmark checks
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - name: Install Rust nightly
      run: rustup toolchain install nightly --profile minimal
    - name: Identify toolchains
      id: toolchains
      run: |
        rustc --version > "$RUNNER_TEMP/toolchains"
        if rustup toolchain list | grep -q '^nightly'; then
          rustc +nightly --version >> "$RUNNER_TEMP/toolchains"
        fi
        echo "key=$(sha256sum "$RUNNER_TEMP/toolchains" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/check-tools
          target
        key: ${{ runner.os }}-${{ github.job }}-${{ steps.toolchains.outputs.key }}-${{ hashFiles('Cargo.lock', '.github/workflows/runtests.yml', 'tickbox/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ github.job }}-${{ steps.toolchains.outputs.key }}-
    - name: Install tickbox
      run: |
        echo "$RUNNER_TEMP/check-tools/bin" >> "$GITHUB_PATH"
        cargo install --root "$RUNNER_TEMP/check-tools" --locked tickbox
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y librtlsdr-dev libsoapysdr-dev libjack-dev libasound-dev libfftw3-dev libpipewire-0.3-dev libvolk-dev libuhd-dev
    - name: Run extended checks
      run: SLOW=true NODIFF=true tickbox --dir tickbox/precommit --disable-tui --max-concurrency=1 --matching '^(10|30|31|50|60)-.*'

  msrv:
    name: Test minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          msrv="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - name: Install MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-${{ steps.msrv.outputs.version }}-

      - name: Run native tests with MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" test --workspace --locked

  # tar -I 'zstd -T0 -19' -cf fixtures.tar.zst tests/testdata/
  # sha256sum fixtures.tar.zst > tests/fixtures.sha256
  # gh release create test-data-v${N?} fixtures.tar.zst --title "E2E test fixtures v${N?}" --notes "Test input data for end-to-end tests."
  # Then update the version number in the workflow below.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Download test fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download test-data-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern fixtures.tar.zst
          sha256sum -c tests/fixtures.sha256
          tar --zstd -xf fixtures.tar.zst
      - name: Run E2E tests
        run: cargo test --locked --workspace --release -- --ignored
