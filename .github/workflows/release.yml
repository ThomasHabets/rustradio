name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 (defaults to next version)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Require successful commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Wait for commit checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow runtests.yml --branch main --event push \
            --commit "$GITHUB_SHA" --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No Run tests workflow found for commit $GITHUB_SHA"
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
            --json conclusion --jq '.conclusion')"
          if [ "$conclusion" != success ]; then
            echo "::error::Run tests for commit $GITHUB_SHA concluded: $conclusion"
            exit 1
          fi

  release:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Download test fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download test-data-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern fixtures.tar.zst
          sha256sum -c tests/fixtures.sha256
          tar --zstd -xf fixtures.tar.zst

      - name: Cargo install
        run: cargo install --locked tickbox cargo-semver-checks

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librtlsdr-dev libsoapysdr-dev libjack-dev libasound-dev libfftw3-dev libpipewire-0.3-dev libvolk-dev libuhd-dev

      - name: Run release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CLEANUP=true tickbox --dir tickbox/bump_version --disable-tui --max-concurrency=1
  github-release:
    needs: release
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --verify-tag \
            --generate-notes
