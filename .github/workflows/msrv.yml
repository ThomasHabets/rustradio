name: Test MSRV

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  msrv:
    name: Test minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          msrv="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - name: Install MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-${{ steps.msrv.outputs.version }}-

      - name: Run native tests with MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" test --workspace --locked
