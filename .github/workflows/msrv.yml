name: Test MSRV

on:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Test minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          msrv="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - name: Install MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal --target wasm32-unknown-unknown

      # Building the UI together with native examples enables its wasm feature
      # on their shared RustRadio dependency, which disables the native MTGraph.
      - name: Run native tests with MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" test --workspace --exclude rustradio-ui --locked

      - name: Check WASM UI with MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check -p rustradio-ui --target wasm32-unknown-unknown --locked
