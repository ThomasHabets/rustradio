[workspace]
members = ["rustradio-ui","rustradio_macros", "rustradio_macros_code" ]

[package]
name = "rustradio"
version = "0.18.4"
edition = "2024"
license = "MIT"
authors = ["Thomas Habets <thomas@habets.se>"]
readme = "README.md"
repository = "https://github.com/ThomasHabets/rustradio"
description = "Software defined radio library"
keywords = ["SDR", "radio"]
# Min version restricted by algebraic operators
rust-version = "1.98"

# See more keys and their definitions at
# https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4"
num-complex = "0.4"
rustfft = "6.2"
tempfile = "3.19"
rtlsdr = {version = "0.1.4", optional=true}
fast-math = {version = "0.1", optional=true}
libc = "0.2.149"
# soapysdr 0.4.2 for time_ns() and reading sensors.
soapysdr = { version = "0.4.2", optional = true }
serde_json = "1.0"
serde = {version = "1.0", features = ["derive"]}
cpal = { version = "0.15", features = ["jack"], optional=true }
rustradio_macros = { version = "0.18.4", path = "rustradio_macros" }
rayon = "1.10"
itertools = "0.13"
tar = "0.4"
sha2 = "0.10"
thiserror = "2.0"
async-trait = "0.1"
nix = { version = "0.30.1", optional = true, features = ["term"] }
pipewire = { version = "0.8.0", optional = true }
volk = { version = "0.2", optional = true }
web-sys = { version = "0.3.77", features = ["Performance", "Window"], optional = true }
wasm-bindgen = { version = "0.2.100", optional = true }
async-channel = { version = "2.5.0", default-features = false, optional=true }
prost = { version = "0.14", optional = true, features = ["no-recursion-limit"] }
prost-types = { version = "0.14", optional = true }
uhd = { version = "0.4.1", optional=true }
# System fftw has been many times faster for me than not. Maybe because the C
# code is not compiled with the right options, like -march=native?
[dependencies.fftw]
version = "0.8"
default-features = false
features = ["system"]
optional = true

[dev-dependencies]
rand = "0.9.3"
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
stderrlog = "0.6"
ctrlc = "3.4"
ratatui = { version = "0.30", features = ["all-widgets"]}
crossterm = "0.29"
humantime = "2.2.0"
rustyline = { version = "18.0.1", default-features = false, features = ["custom-bindings"] }
# apt install libgoogle-perftools-dev google-perftools
# Uncomment the PROFILER stuff in examples/ax25-1200-rx.rs
# google-pprof --lines target/release/examples/ax25-1200-rx my-prof.prof
# gperftools = "0.2.0"

[lib]
name = "rustradio"
path = "src/lib.rs"

[features]
default = ["fast-math"]
async = ["dep:tokio"]
audio = ["dep:cpal"]
fast-math = ["dep:fast-math"]
fftw = ["dep:fftw"]
nix = ["dep:nix"]
pipewire = ["dep:pipewire"]
rtlsdr = ["dep:rtlsdr"]
simd = []
soapysdr = ["dep:soapysdr"]
tokio-unstable = ["tokio/tracing"]
volk = ["dep:volk"]
uhd = ["dep:uhd"]
wasm = ["dep:web-sys", "dep:wasm-bindgen", "dep:async-channel"]
unstable = ["dep:prost", "dep:prost-types", "dep:async-channel", "dep:tonic", "dep:axum", "dep:futures-util", "dep:tokio-stream", "dep:tokio"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.44", optional = true, features = ["full"] }
tonic = { version = "0.14", optional = true, features = ["transport", "router", "tls-ring", "tls-native-roots"] }
axum = { version = "0.8", optional = true, features = ["ws", "http2"] }
futures-util = { version = "0.3", optional = true, features = ["sink"] }
tokio-stream = { version = "0.1", optional = true }

[[example]]
name = "bell202"
required-features = ["soapysdr"]

[[example]]
name = "g3ruh"
required-features = ["soapysdr"]

[[example]]
name = "capture"
required-features = ["soapysdr"]

[[example]]
name = "morse_beacon"
required-features = ["soapysdr"]

[[example]]
name = "fm_tx"
required-features = ["soapysdr"]

[[example]]
name = "restaurant_pager_tx"
required-features = ["soapysdr"]

[[example]]
name = "rtl_downsampled"
required-features = ["rtlsdr"]

[[example]]
name = "rtl_data_stream"
required-features = ["rtlsdr"]

[[example]]
name = "tone"
required-features = ["audio"]

[[example]]
name = "pw_tone"
required-features = ["pipewire"]

[[example]]
name = "airspy_am_decode"
required-features = ["audio"]

[[example]]
name = "uhd_full_duplex"
required-features = ["uhd"]

[[example]]
name = "soapy_fm"
required-features = ["soapysdr"]

[profile.nodebug]
inherits = "dev"
debug = 0
strip = "debuginfo"

# Disabled overflow checks help speed by like 8%.
overflow-checks = true

# LTO speeds up by like 15%.
lto = true

# They say that lower should make for faster code, but empirically it seems that
# it only makes things worse.
# codegen-units = 1

[profile.release.package."*"]
overflow-checks = true

# vim: textwidth=80

[lints.clippy]
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[patch.crates-io]
# uhd = { path = "../uhd-rust/uhd" }

[[example]]
name = "iq_stream"
required-features = ["unstable"]

[[example]]
name = "iq_waterfall"
required-features = ["unstable"]
